<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Auto Unfollow Instagram</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, sans-serif;
      color: #172033;
      background: #fff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      width: 370px;
      max-height: 620px;
      overflow-y: auto;
      padding: 12px;
      margin: 0;
      font-size: 12px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;
      font-size: 15px;
    }

    .language-switch {
      display: flex;
      gap: 4px;
    }

    .language-switch button {
      width: auto;
      padding: 4px 7px;
      border: 1px solid #d5d9e0;
      border-radius: 6px;
      background: #fff;
      color: #445064;
      font-size: 10px;
    }

    .language-switch button.active {
      border-color: #7044c5;
      background: #7044c5;
      color: #fff;
    }

    .notice {
      padding: 8px 9px;
      border-radius: 6px;
      background: #fff2d6;
      color: #754600;
      line-height: 1.45;
      font-size: 11px;
    }

    .notice p {
      margin: 0;
    }

    .notice .caveat {
      margin-top: 5px;
      color: #805a20;
      font-size: 10px;
    }

    .settings-panel {
      margin-top: 10px;
      padding: 2px 9px;
      border: 1px solid #e3e5e9;
      border-radius: 8px;
    }

    .setting-row {
      display: flex;
      min-height: 38px;
      align-items: center;
      justify-content: space-between;
      gap: 7px;
      padding: 6px 0;
      border-bottom: 1px solid #edf0f3;
    }

    .setting-row:last-child {
      border-bottom: 0;
    }

    .setting-label {
      flex: 1;
      min-width: 0;
      color: #273248;
      line-height: 1.3;
    }

    .setting-fields {
      display: flex;
      align-items: center;
      flex: none;
      gap: 5px;
    }

    .setting-inline {
      justify-content: flex-start;
    }

    .setting-inline [data-i18n="usersUnfollowedLabel"] {
      flex: 1;
    }

    input[type="number"] {
      width: 58px;
      min-width: 0;
      padding: 5px 6px;
      border: 1px solid #d9dce2;
      border-radius: 6px;
      background: #f7f7f9;
      color: #172033;
      font: inherit;
      font-size: 11px;
    }

    #targetUnfollow {
      width: 64px;
    }

    .range-row {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .unit {
      color: #677184;
      font-size: 10px;
      white-space: nowrap;
    }

    .running-info {
      display: grid;
      gap: 6px;
      padding: 10px 0;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      color: #515c70;
    }

    .info-row strong {
      color: #172033;
      font-variant-numeric: tabular-nums;
    }

    #status {
      min-height: 16px;
      margin: 6px 0 9px;
      color: #515c70;
      text-align: center;
      line-height: 1.3;
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    .actions button {
      width: 100%;
      padding: 8px;
      border: 0;
      border-radius: 7px;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    #startBtn {
      background: #7044c5;
    }

    #startBtn:hover:not(:disabled) {
      background: #5e35b1;
    }

    #stopBtn {
      background: #d64242;
    }

    #stopBtn:hover:not(:disabled) {
      background: #bf3030;
    }

    button:disabled,
    input:disabled {
      cursor: not-allowed;
      opacity: .55;
    }
  </style>
</head>
<body>
  <header>
    <h1 data-i18n="title">Auto Unfollow IG</h1>
    <div class="language-switch" role="group" aria-label="Language">
      <button id="langId" type="button" class="active" aria-pressed="true">ID</button>
      <button id="langEn" type="button" aria-pressed="false">EN</button>
    </div>
  </header>

  <aside class="notice">
    <p data-i18n="dailyNotice">Gunakan target 200 unfollow per hari untuk menjaga keamanan akun.</p>
    <p class="caveat" data-i18n="safetyCaveat">Batas Instagram dapat berubah; jeda tidak menjamin akun aman.</p>
  </aside>

  <section class="settings-panel" aria-label="Settings">
    <div class="setting-row">
      <label class="setting-label" for="targetUnfollow" data-i18n="targetLabel">Target total unfollow</label>
      <div class="setting-fields">
        <input id="targetUnfollow" type="number" value="200" min="1" step="1" inputmode="numeric">
      </div>
      <span class="unit" data-i18n="usersUnit">akun</span>
    </div>

    <div class="setting-row">
      <label class="setting-label" for="minDelay" data-i18n="intervalLabel">Rentang jeda (detik)</label>
      <div class="range-row">
        <input id="minDelay" type="number" value="10" min="1" max="2147483" step="1" inputmode="numeric" aria-label="Minimum delay in seconds">
        <span class="unit" aria-hidden="true">–</span>
        <input id="maxDelay" type="number" value="15" min="1" max="2147483" step="1" inputmode="numeric" aria-label="Maximum delay in seconds">
      </div>
    </div>

    <div class="setting-row setting-inline">
      <span data-i18n="forEveryLabel">Setiap</span>
      <input id="cooldownEvery" type="number" value="9" min="1" step="1" inputmode="numeric" data-i18n-aria="cooldownEveryAria">
      <span data-i18n="usersUnfollowedLabel">akun berhasil di-unfollow</span>
    </div>

    <div class="setting-row">
      <label class="setting-label" for="cooldownMinutes" data-i18n="cooldownDurationLabel">Istirahat selama</label>
      <div class="setting-fields">
        <input id="cooldownMinutes" type="number" value="10" min="1" max="35791" step="1" inputmode="numeric" data-i18n-aria="cooldownDurationAria">
        <span class="unit" data-i18n="minutesUnit">menit</span>
      </div>
    </div>

    <div class="setting-row">
      <label class="setting-label" for="failurePause"><span data-i18n="failurePrefix">Jika permintaan gagal, jeda selama</span> <span data-i18n="failureSuffix">sebelum mencoba lagi</span></label>
      <div class="setting-fields">
        <input id="failurePause" type="number" value="30" min="1" max="35791" step="1" inputmode="numeric">
        <span class="unit" data-i18n="minutesUnit">menit</span>
      </div>
    </div>
  </section>

  <section class="running-info" aria-live="polite">
    <div class="info-row">
      <span data-i18n="nextActionLabel">Aksi berikutnya dalam</span>
      <strong id="nextAction">--:--:--</strong>
    </div>
    <div class="info-row">
      <span data-i18n="runtimeLabel">Aplikasi berjalan selama</span>
      <strong id="runtime">00:00:00</strong>
    </div>
  </section>

  <div id="status" role="status" aria-live="polite" data-i18n="statusReady">Status: Siap</div>

  <div class="actions">
    <button id="startBtn" type="button" data-i18n="startButton">Mulai</button>
    <button id="stopBtn" type="button" data-i18n="stopButton" disabled>Stop</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
